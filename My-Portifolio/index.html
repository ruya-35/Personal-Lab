<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Rabia | Frontend Developer Portfolio</title>
</head>
<body>
    <header>
        <a href="#home" class="logo">Rabia</a>
        <nav id="nav-menu">
        </nav>
    </header>

    <section id="home" class="home">
        <h1 id="hero-title">Creative Frontend Developer</h1>
        <p id="hero-desc">Creating immersive digital experience using HTML, CSS and JavaScript.</p>
        <a href="#projects" class="btn">View Projects</a>
    </section>

    <section id="about" class="section">
        <h2 class="section-title">About Me</h2>
        <div class="about-content">
            <p id="about-text">Loading about info...</p>
        </div>
    </section>

    <section id="skills" class="section">
        <h2 class="section-title">My Skills</h2>
        <div class="skills-grid" id="skills-grid">
        </div>
    </section>

    <section id="services" class="section">
        <h2 class="section-title">Services</h2>
        <div class="services-grid" id="services-grid">
        </div>
    </section>

    <section id="projects" class="section">
        <h2 class="section-title">Projects</h2>
        <div class="projects-grid" id="projects-grid">
        </div>
    </section>

    <section id="contact" class="section">
        <h2 class="section-title">Contact Me</h2>
        <form id="contact-form" class="contact-form">
            <input type="text" id="contact-name" placeholder="Your Name" required>
            <input type="email" id="contact-email" placeholder="Your Email" required>
            <textarea id="contact-message" placeholder="Your Message" rows="5" required></textarea>
            <button type="submit" class="btn">Send Message</button>
        </form>
    </section>

    <footer>
        <p id="footer-text">&copy; 2026 Rabia. All rights reserved.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
